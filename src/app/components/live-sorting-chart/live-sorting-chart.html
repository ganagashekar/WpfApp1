  <!-- [enableSideBySidePlacement]="false" -->


  <ejs-chart
  #chart
  [title]="title"
  [primaryXAxis]="primaryXAxis"
  [primaryYAxis]="primaryYAxis"
  [legendSettings]="legendSettings"
  [tooltip]="tooltip"
  (pointRender)="pointRender($event)"
  (axisRangeCalculated)="axisRangeCalculated($event)"
>

  <e-series-collection>
    <e-series
      type="Column"
      [dataSource]="data"
      xName="x"
      yName="y"
      [marker]="marker"
      [animation]="{ enable: false }"
    >
    </e-series>
  </e-series-collection>

</ejs-chart>
