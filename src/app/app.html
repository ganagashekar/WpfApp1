<div class="layout" [class.collapsed]="collapsed()">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo" *ngIf="!collapsed()">⚡ {{ title() }}</span>

      <button class="toggle-btn" (click)="toggleSidebar()">
        ☰
      </button>
    </div>

    <nav>
      <a routerLink="/live" routerLinkActive="active">
        <span class="icon">📊</span>
        <span class="text" *ngIf="!collapsed()">Live Chart</span>
      </a>
      <a
  routerLink="/live-sorting"
  routerLinkActive="active"
> 
  <span class="icon">📈</span>
  <span class="text" *ngIf="!collapsed()">Live Sorting Chart</span>
</a>
<a
  routerLink="/market-dashboard"
  routerLinkActive="active"
>
  <span class="icon">📈</span>
  <span class="text" *ngIf="!collapsed()">Live Sorting Chart</span>
</a>

    </nav>
  </aside>

  <!-- Main Content -->
  <main class="content">
    <router-outlet></router-outlet>
  </main>

</div>
